<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Prática de Seletores</title>

    <style>
        p {
            font-size: 18px;
        }

        .p1 {
            color: red;
            font-family: Arial;
        }

        .p2 {
            color: blue;
            font-family: Georgia;
        }

        .p3 {
            color: green;
            font-family: Verdana;
        }

        span {
            font-weight: bold;
            background-color: yellow;
        }

        .destaque {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Prática de Seletores</h1>

    <p class="p1">
        Lorem ipsum dolor sit amet, consectetur <span>adipiscing</span> elit.
    </p>

    <p class="p2">
        Lorem ipsum dolor sit amet, consectetur <span class="destaque">tempor</span> incididunt.
    </p>

    <p class="p3">
        Lorem ipsum dolor sit amet, consectetur <span>laboris</span> et dolore magna.
    </p>

</body>

</html>
