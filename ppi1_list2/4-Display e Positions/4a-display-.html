<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>4a - Display</title>

    <style>
        .bloco {
            width: 100%;
            height: 70px;
            display: block;
            text-align: center;
            padding-top: 25px;
            box-sizing: border-box;
        }

        .roxo {
            background-color: #7200ff;
        }

        .verde {
            background-color: green;
        }

        .vermelho {
            background-color: red;
        }

        .amarelo {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div class="bloco roxo">1</div>
    <div class="bloco verde">2</div>
    <div class="bloco vermelho">3</div>
    <div class="bloco amarelo">4</div>

</body>
</html>
