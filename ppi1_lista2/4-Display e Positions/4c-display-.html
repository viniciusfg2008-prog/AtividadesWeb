<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>4c - Position</title>

    <style>

        .quadrado {
            position: absolute;
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
        }

        .vermelho {
            background-color: red;
            top: 0;
            left: 0;
        }

        .amarelo {
            background-color: yellow;
            top: 0;
            right: 0;
        }

        .rosa {
            background-color: magenta;
            top: 50%;
            left: 50%;
            bottom: 50%;
            right: 50%;
        }

        .azul {
            background-color: blue;
            bottom: 0;
            left: 0;
        }

        .verde {
            background-color: green;
            bottom: 0;
            right: 0;
        }
    </style>
</head>

<body>

    <div class="quadrado vermelho">1</div>

    <div class="quadrado amarelo">2</div>

    <div class="quadrado rosa">3</div>

    <div class="quadrado azul">4</div>

    <div class="quadrado verde">5</div>

</body>
</html>
