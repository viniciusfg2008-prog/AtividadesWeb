<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Barquinho Animado</title>

    <style>

        .cena {
            width: 600px;
            height: 350px;
            background: linear-gradient(#bdefff, #ffffff);
            position: relative;
            overflow: hidden;
        }

        .mar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #4055ff;
            z-index: 1;
        }


        .barquinho {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 90px;
            height: 45px;
            animation: navegar 8s linear infinite;
            z-index: 2;
        }

        .barquinho::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 5px;
            width: 80px;
            height: 20px;
            background: white;
            border: 4px solid black;
            border-radius: 0 0 40px 40px;
        }

        .barquinho::before {
            content: "";
            position: absolute;
            left: 40px;
            bottom: 20px;
            width: 4px;
            height: 55px;
            background: black;
        }


        @keyframes navegar {

            0% {
                left: -100px;
            }

            50% {
                transform: translateY(-5px);
            }

            100% {
                left: 600px;
                transform: translateY(0);
            }

        }


        .nuvem {
            position: absolute;
            top: 70px;
            left: -150px;
            width: 100px;
            height: 35px;
            background: white;
            border-radius: 30px;
            box-shadow: 25px -15px 0 white,
                        50px 0 0 white;
            animation: nuvem 20s linear infinite;
            z-index: 0;
        }


        @keyframes nuvem {

            0% {
                left: -150px;
            }

            100% {
                left: 650px;
            }

        }

    </style>
</head>

<body>

    <div class="cena">

        <div class="nuvem"></div>

        <div class="barquinho"></div>

        <div class="mar"></div>

    </div>

</body>
</html>
