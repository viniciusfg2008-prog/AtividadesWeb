<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout</title>
  <style>

    .pagina {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: 1fr 2fr;
      gap: 8px;
      min-height: 100vh;
      min-width: 100vw;
      padding: 20px;
    }

    .a, .b, .c, .d {
      background: #444444;
      color: #ffffff;
      border-radius: 4px;
      padding: 12px;
    }

    .a { grid-column: 1 / 6; }
    .b { grid-column: 9 / 11; }

    .c { grid-column: 1 / 4; }
    .d { grid-column: 4 / 11; }

    .d {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }

    .d div {
      background: #cccccc;
      color: #444444;
      border-radius: 4px;
      padding: 12px;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="pagina">
    <div class="a">A</div>
    <div class="b">B</div>
    <div class="c">C</div>

    <div class="d">
      <div>E</div>
      <div>F</div>
      <div>G</div>
      <div>M</div>
      <div>I</div>
      <div>J</div>
    </div>
  </div>
</body>
</html>
