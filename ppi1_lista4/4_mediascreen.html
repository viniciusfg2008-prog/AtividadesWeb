<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout responsivo</title>
  <style>
   
    body {
      font-size: 14px;
      font-weight: bold;
    }

    .pagina {
      display: grid;
      grid-template-columns: 1fr 6fr 1fr;
      grid-template-rows: 60px 50px 1fr 60px 50px;
      grid-template-areas:
        "header header header"
        "left   banner right"
        "left   main   right"
        "left   low    right"
        "footer footer footer";
      gap: 6px;
      min-height: 100vh;
      padding: 6px;
    }

    .pagina > * {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 8px;
    }

    header { grid-area: header; background: #f0b400; }
    .banner { grid-area: banner; background: #dc4437; }
    .left { grid-area: left; background: #0f9d58; }
    main { grid-area: main; background: #4285f4; }
    .right { grid-area: right; background: #f0b400; }
    .low { grid-area: low; background: #0f9d58; }
    footer { grid-area: footer; background: #4285f4; }

    @media screen and (max-width: 600px) {
      .pagina {
        grid-template-columns: 1fr;
        grid-template-rows: 60px 50px 50px 1fr 50px 50px 60px;
        grid-template-areas:
          "header"
          "banner"
          "left"
          "main"
          "right"
          "low"
          "footer";
      }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <header>Header</header>
    <div class="banner">Banner</div>
    <div class="left">Left Aside</div>
    <main>Main Content</main>
    <div class="right">Right Aside</div>
    <div class="low">Low Content</div>
    <footer>Footer</footer>
  </div>
</body>
</html>
