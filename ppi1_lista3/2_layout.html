<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout</title>
  <style>

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .card {
      width: 250px;
      height: 415px;
      padding: 28px 22px 22px;
      background: #ffffff;
      border: 3px solid #a100e0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      color: #9a9a9a;
      margin-bottom: 30px;
    }

    .bars {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bar {
      width: 100%;
      height: 20px;
      background: #bdbbbb;
      border-radius: 4px;
    }

    .footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: #bdbbbb;
      border-radius: 50%;
    }

    .button {
      width: 76px;
      height: 20px;
      background: #bdbbbb;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo"><strong>Company Logo</strong></span>

    <div class="bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="footer">
      <div class="avatar"></div>
      <div class="button"></div>
    </div>
  </div>
</body>
</html>
