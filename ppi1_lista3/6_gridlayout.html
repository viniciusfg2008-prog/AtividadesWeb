<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout com grid</title>
  <style>
    
    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .grade {
      display: grid;
      grid-template-columns: 3fr 2fr 2fr 1fr;
      grid-template-rows: 62fr 55fr 42fr;
      grid-template-areas:
        "laranja salmao azulclaro azulclaro"
        "azul    salmao verde     circulos"
        "amarelo amarelo verde    circulos";
      gap: 8px;
      width: 100vw;
      height: 100vh;
      padding: 8px;
    }

    .laranja   { grid-area: laranja;   background: #f99d27; }
    .salmao    { grid-area: salmao;    background: #f5b7a8; }
    .azulclaro { grid-area: azulclaro; background: #c8dfdf; }
    .azul      { grid-area: azul;      background: #b8c8e0; }
    .verde     { grid-area: verde;     background: #bccd6c; }
    .amarelo   { grid-area: amarelo;   background: #f4b53a; }

    .circulos {
      grid-area: circulos;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    .circulos span {
      width: clamp(16px, 3vw, 36px);
      height: clamp(16px, 3vw, 36px);
      border-radius: 50%;
    }

    .circulos span:nth-child(1) { background: #f0956a; }
    .circulos span:nth-child(2) { background: #d9a9a5; }
    .circulos span:nth-child(3) { background: #b8c48f; }
    .circulos span:nth-child(4) { background: #d3c4e6; }

    @media (max-width: 600px) {
      .grade {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(7, minmax(90px, 1fr));
        grid-template-areas:
          "laranja"
          "salmao"
          "azulclaro"
          "azul"
          "verde"
          "amarelo"
          "circulos";
        width: 100%;
        height: auto;
        min-height: 100vh;
      }

      .circulos {
        flex-direction: row;
      }

      .circulos span {
        width: 28px;
        height: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="grade">
    <div class="laranja"></div>
    <div class="salmao"></div>
    <div class="azulclaro"></div>
    <div class="azul"></div>
    <div class="verde"></div>
    <div class="amarelo"></div>
    <div class="circulos">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</body>
</html>
