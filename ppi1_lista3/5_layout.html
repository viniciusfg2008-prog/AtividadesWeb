<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout com flex</title>
  <style>
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #222222;
    }

    .pagina {
      display: flex;
      flex-direction: column;
      width: 90%;
      max-width: 525px;
      height: 360px;
    }

    header,
    footer {
      flex: 0 0 72px;
      padding: 10px 12px;
      background: #9dcf0c;
    }

    .meio {
      flex: 1;
      display: flex;
    }

    article {
      flex: 3;
      padding: 10px 12px;
      background: #fdfdfb;
    }

    aside {
      flex: 1;
      padding: 10px 12px;
      background: #f5f4d9;
    }

    nav {
      flex: 1;
      padding: 10px 12px;
      background: #d5e8d7;
    }
  </style>
</head>
<body>
  <div class="pagina">
    <header>Header</header>

    <div class="meio">
      <article>Article</article>
      <aside>Aside</aside>
      <nav>Nav</nav>
    </div>

    <footer>Footer</footer>
  </div>
</body>
</html>
